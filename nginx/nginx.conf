worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/html;

    # ==================== 限流区域 ====================
    # 通用 API 限流：每分钟 100 次
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    # 登录限流：每分钟 5 次
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # ==================== 前端 SPA ====================
    server {
        listen 80;
        server_name localhost;

        # 前端静态资源
        root /usr/share/nginx/html;
        index index.html;

        # SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ==================== API 反向代理 ====================
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://server:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 登录接口独立限流
        location /api/auth/login {
            limit_req zone=login_limit burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://server:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================== 静态小说正文（直接返回，不经过后端）====================
        location /novels/ {
            alias /data/novels/;
            # 只允许 .html 和 .json
            location ~ \.(html|json|jpg|jpeg|png|webp|gif)$ {
                expires 1h;
                add_header Cache-Control "public, immutable";
            }
            location ~ \.php$ { deny all; }
        }

        # ==================== 上传资源 ====================
        location /uploads/ {
            alias /data/uploads/;
            # 禁止脚本执行
            location ~ \.php$ { deny all; }
        }

        # 安全头（🔒 安全审计：加固响应头，生产环境建议再叠加 HTTPS）
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # 内容安全策略：script-src 'self' 防外部脚本注入；沙盒页面自带更细粒度 CSP
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http: https: ws: wss:; frame-ancestors 'self'; base-uri 'self'" always;
        # 启用 HSTS（仅 HTTPS 生效；首次部署先注释，确认 HTTPS 可用后再放开）
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ==================== HTTPS 监听（生产启用；证书路径按实际情况修改） ====================
